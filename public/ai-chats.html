<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laddu AI — Live Chat Monitor (KshirSagar Admin)</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-neutral-100 text-neutral-900 h-screen flex flex-col overflow-hidden">

  <!-- Top Header -->
  <header class="bg-white border-b border-neutral-200 px-5 py-3.5 flex items-center justify-between flex-none">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-neutral-900 text-white flex items-center justify-center font-bold text-sm">L</div>
      <div>
        <h1 class="font-bold text-base text-neutral-900 leading-tight">Laddu AI — Live Chat Monitor</h1>
        <p class="text-xs text-neutral-500">User-wise separated chat transcripts powered by Supabase</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <a href="/admin.html" class="px-3.5 py-1.5 rounded-full bg-neutral-100 hover:bg-neutral-200 text-xs font-semibold text-neutral-700 transition-colors">
        ← Orders Admin
      </a>
      <button id="btnRefresh" class="px-4 py-1.5 rounded-full bg-neutral-900 hover:bg-neutral-800 text-white text-xs font-semibold transition-colors">
        ↻ Refresh Chats
      </button>
    </div>
  </header>

  <!-- Main Split View (WhatsApp Web Style: Left User List, Right Full Transcript) -->
  <div class="flex-1 flex overflow-hidden">
    <!-- Left Sidebar: User Sessions List -->
    <aside class="w-full md:w-80 lg:w-96 bg-white border-r border-neutral-200 flex flex-col">
      <div class="p-3 border-b border-neutral-100">
        <input id="searchInput" type="text" placeholder="Search by Visitor ID, Name, Phone or Message..." class="w-full bg-neutral-100 rounded-full px-4 py-2 text-xs text-neutral-900 placeholder-neutral-400 focus:outline-none" />
      </div>
      <div id="sessionList" class="flex-1 overflow-y-auto divide-y divide-neutral-100">
        <div class="p-6 text-center text-xs text-neutral-400">Loading chat sessions...</div>
      </div>
    </aside>

    <!-- Right Panel: Selected User's Full Chat History -->
    <main class="hidden md:flex flex-1 flex-col bg-neutral-50">
      <div id="chatHeader" class="bg-white border-b border-neutral-200 px-6 py-3.5 flex items-center justify-between">
        <div>
          <h2 id="activeUserTitle" class="font-semibold text-sm text-neutral-900">Select a user from the left list</h2>
          <p id="activeUserMeta" class="text-xs text-neutral-400">Full conversation history will appear here</p>
        </div>
      </div>

      <div id="transcriptContainer" class="flex-1 overflow-y-auto p-6 space-y-4 max-w-3xl w-full mx-auto">
        <div class="text-center text-xs text-neutral-400 py-20">
          बाईं तरफ़ किसी भी यूज़र पर क्लिक करके उसकी पूरी बातचीत देखें।
        </div>
      </div>
    </main>
  </div>

  <script>
    (function() {
      let allSessions = [];
      let selectedSessionId = null;

      const sessionListEl = document.getElementById('sessionList');
      const transcriptEl = document.getElementById('transcriptContainer');
      const activeUserTitle = document.getElementById('activeUserTitle');
      const activeUserMeta = document.getElementById('activeUserMeta');
      const searchInput = document.getElementById('searchInput');
      const btnRefresh = document.getElementById('btnRefresh');

      function formatTime(iso) {
        if (!iso) return '';
        try {
          return new Date(iso).toLocaleString('en-IN', {
            day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
          });
        } catch {
          return iso;
        }
      }

      async function loadSessions() {
        btnRefresh.innerText = 'Loading...';
        try {
          const res = await fetch('/.netlify/functions/aiChat');
          const data = await res.json();
          allSessions = Array.isArray(data.sessions) ? data.sessions : [];
          renderSessionList();
          if (selectedSessionId) {
            const found = allSessions.find(s => s.session_id === selectedSessionId);
            if (found) renderTranscript(found);
          } else if (allSessions.length > 0) {
            selectedSessionId = allSessions[0].session_id;
            renderSessionList();
            renderTranscript(allSessions[0]);
          }
        } catch (err) {
          sessionListEl.innerHTML = '<div class="p-6 text-center text-xs text-red-500">Failed to load sessions. Deploy to Netlify or run npx netlify dev.</div>';
        } finally {
          btnRefresh.innerText = '↻ Refresh Chats';
        }
      }

      function renderSessionList() {
        const q = (searchInput.value || '').toLowerCase().trim();
        const filtered = allSessions.filter(s => {
          if (!q) return true;
          return (
            String(s.session_id || '').toLowerCase().includes(q) ||
            String(s.customer_name || '').toLowerCase().includes(q) ||
            String(s.customer_mobile || '').toLowerCase().includes(q) ||
            String(s.last_user_message || '').toLowerCase().includes(q)
          );
        });

        if (filtered.length === 0) {
          sessionListEl.innerHTML = '<div class="p-6 text-center text-xs text-neutral-400">अभी कोई चैट रिकॉर्ड नहीं मिला।</div>';
          return;
        }

        sessionListEl.innerHTML = '';
        filtered.forEach(session => {
          const isSelected = session.session_id === selectedSessionId;
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'w-full text-left p-4 hover:bg-neutral-50 transition-colors flex flex-col gap-1 ' + (isSelected ? 'bg-neutral-100' : '');

          const displayName = session.customer_name && session.customer_name !== 'Guest User'
            ? `${session.customer_name} (${session.session_id})`
            : `Visitor ${session.session_id}`;

          item.innerHTML = `
            <div class="flex items-center justify-between">
              <span class="font-semibold text-xs text-neutral-900 truncate">${displayName}</span>
              <span class="text-[10px] text-neutral-400">${formatTime(session.updated_at)}</span>
            </div>
            <div class="flex items-center justify-between text-[11px] text-neutral-500">
              <span class="truncate pr-2">${session.last_user_message || ''}</span>
              <span class="px-2 py-0.5 rounded-full bg-neutral-200 text-neutral-800 text-[10px] font-semibold flex-shrink-0">${session.message_count || 1} msgs</span>
            </div>
            <div class="text-[10px] text-neutral-400 truncate">
              ${session.customer_mobile ? '📞 ' + session.customer_mobile + ' • ' : ''}📱 ${session.device_info || 'Web'}
            </div>
          `;

          item.addEventListener('click', () => {
            selectedSessionId = session.session_id;
            renderSessionList();
            renderTranscript(session);
          });

          sessionListEl.appendChild(item);
        });
      }

      function renderTranscript(session) {
        const displayName = session.customer_name && session.customer_name !== 'Guest User'
          ? `${session.customer_name} (${session.session_id})`
          : `Visitor ${session.session_id}`;

        activeUserTitle.innerText = displayName;
        activeUserMeta.innerText = `${session.customer_mobile ? '📞 ' + session.customer_mobile + ' • ' : ''}📱 ${session.device_info || 'Web'} • Total turns: ${session.message_count || 1}`;

        const conv = Array.isArray(session.conversation) ? session.conversation : [];
        if (conv.length === 0) {
          transcriptEl.innerHTML = '<div class="text-center text-xs text-neutral-400 py-12">No messages in this session.</div>';
          return;
        }

        transcriptEl.innerHTML = '';
        conv.forEach(msg => {
          const row = document.createElement('div');
          const isUser = msg.role === 'user';
          row.className = 'flex flex-col ' + (isUser ? 'items-end' : 'items-start');

          row.innerHTML = `
            <div class="max-w-[82%] rounded-2xl px-4 py-2.5 text-xs leading-relaxed ${isUser ? 'bg-neutral-900 text-white' : 'bg-white border border-neutral-200 text-neutral-900'}">
              <div class="whitespace-pre-wrap">${String(msg.text || '').replace(/</g, '&lt;')}</div>
            </div>
            <span class="text-[10px] text-neutral-400 mt-1 px-1">${isUser ? 'User' : 'Laddu AI'} • ${formatTime(msg.timestamp)}</span>
          `;
          transcriptEl.appendChild(row);
        });

        transcriptEl.scrollTop = transcriptEl.scrollHeight;
      }

      searchInput.addEventListener('input', renderSessionList);
      btnRefresh.addEventListener('click', loadSessions);

      loadSessions();
    })();
  </script>
</body>
</html>
