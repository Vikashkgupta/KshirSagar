<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kshirsagar Sweets & Bakers — Admin Dashboard</title>
     <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <style>
        :root {
            --bg-cream: #FDFBF7;
            --primary-green: #1B4332;
            --primary-green-hover: #2D6A4F;
            --accent-gold: #D4AF37;
            --accent-gold-light: #F9F4E3;
            --text-dark: #1A202C;
            --text-muted: #4A5568;
            --card-bg: #FFFFFF;
            --border-color: #E2E8F0;
            --success: #2F855A;
            --danger: #C53030;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
            --radius-md: 8px;
            --radius-lg: 12px;
            --font-main: system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-main); background-color: var(--bg-cream); color: var(--text-dark); line-height: 1.5; overflow-x: hidden; }
        button, input { font-family: inherit; }
        button { cursor: pointer; border: none; background: none; }
        .hidden { display: none !important; }

        .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 1rem; }

        header {
            background-color: var(--primary-green);
            color: white;
            padding: 0.85rem 1rem;
            border-bottom: 3px solid var(--accent-gold);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .brand-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-logo {
            width: 46px;
            height: 46px;
            /* border-radius: 50%; */
            object-fit: cover;
            /* border: 2px solid var(--accent-gold); */
            /* background-color: #fff; */
        }

        .brand h1 { color: var(--accent-gold); font-size: 1.25rem; line-height: 1.2; }
        .brand p { font-size: 0.78rem; color: #E2E8F0; }

        .header-controls { display: flex; align-items: center; gap: 1rem; }
        .btn-refresh {
            background-color: var(--accent-gold);
            color: var(--primary-green);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.85rem;
        }

        /* Summary Cards */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            margin: 1.25rem 0;
        }
        .summary-card {
            background: var(--card-bg);
            padding: 0.85rem;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--primary-green);
            box-shadow: var(--shadow-sm);
        }
        .summary-card.gold { border-left-color: var(--accent-gold); }
        .summary-card.green { border-left-color: var(--success); }
        .summary-card.red { border-left-color: var(--danger); }
        .summary-title { font-size: 0.7rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
        .summary-value { font-size: 1.5rem; font-weight: 800; margin-top: 0.2rem; }

        /* Tabs - Fixed to prevent horizontal scrolling */
        .tabs { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 0.35rem; 
            border-bottom: 2px solid var(--border-color); 
            margin-bottom: 1.25rem; 
            background: #fff;
            padding: 0.35rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }
        .tab {
            padding: 0.6rem 0.2rem;
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-radius: 6px;
            text-align: center;
            background: transparent;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
        }
        .tab.active { 
            background: var(--primary-green); 
            color: white; 
        }
        .tab-count { 
            background: rgba(0,0,0,0.08); 
            padding: 0.05rem 0.4rem; 
            border-radius: 99px; 
            font-size: 0.7rem; 
        }
        .tab.active .tab-count { 
            background: rgba(255,255,255,0.25); 
            color: white; 
        }

        /* Grid */
        .order-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; }
        .order-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .card-header {
            background: #F8FAFC;
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .order-num { font-weight: 800; color: var(--primary-green); }
        .badge { font-size: 0.7rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 4px; background: #EBF8FF; color: #2B6CB0; text-transform: uppercase; }
        
        .card-body { padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; flex: 1; }
        .cust-name { font-weight: 700; font-size: 1rem; }
        .cust-meta { font-size: 0.82rem; color: var(--text-muted); }
        
        .items-box {
            background: var(--bg-cream);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 0.65rem;
            font-size: 0.85rem;
        }
        .item-row { display: flex; justify-content: space-between; padding: 0.2rem 0; border-bottom: 1px dashed #E2E8F0; }
        .item-row:last-child { border-bottom: none; }

        .notes-box { font-size: 0.78rem; background: #FFFBEB; color: #92400E; padding: 0.4rem 0.6rem; border-radius: 6px; border-left: 3px solid var(--accent-gold); }

        .card-total { display: flex; justify-content: space-between; font-weight: 800; font-size: 1.05rem; color: var(--primary-green); border-top: 1px solid var(--border-color); padding-top: 0.6rem; margin-top: auto; }

        .card-footer { padding: 0.75rem 1rem; background: #FCFDFD; border-top: 1px solid var(--border-color); display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .btn { padding: 0.5rem 0.75rem; border-radius: var(--radius-md); font-weight: 600; font-size: 0.82rem; flex: 1; text-align: center; }
        .btn-primary { background: var(--primary-green); color: white; }
        .btn-outline { border: 1px solid var(--primary-green); color: var(--primary-green); background: white; }
        .btn-danger { border: 1px solid var(--danger); color: var(--danger); background: white; }
        .btn-danger:hover { background: #FFF5F5; }
        .btn-whatsapp { background: #ECFDF5; color: #128C7E; border: 1px solid #A7F3D0; flex: 0 0 auto; }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 3rem; background: white; border-radius: var(--radius-lg); border: 1px dashed var(--border-color); color: var(--text-muted); }

        /* Toast */
        #toast { position: fixed; bottom: 1rem; right: 1rem; background: #1A202C; color: white; padding: 0.75rem 1.25rem; border-radius: var(--radius-md); font-size: 0.85rem; border-left: 4px solid var(--accent-gold); z-index: 100; }

        /* Desktop view enhancements */
        @media (min-width: 768px) {
            .summary-grid { grid-template-columns: repeat(4, 1fr); }
            .order-grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
            .tabs { max-width: 450px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <img src="./logo.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
            <div class="brand">
                <h1>Kshir Sagar Sweets & Bakers</h1>
                <p>Order Management Dashboard</p>
            </div>
        </div>
        <div class="header-controls">
            <span id="conn-status" style="font-size: 0.75rem; background: rgba(255,255,255,0.15); padding: 0.25rem 0.5rem; border-radius: 99px;">Loading...</span>
            <button class="btn-refresh" id="btn-refresh">↻ Refresh</button>
        </div>
    </header>

    <main class="container">
        <section class="summary-grid">
            <div class="summary-card gold">
                <div class="summary-title">Pending</div>
                <div class="summary-value" id="count-pending">0</div>
            </div>
            <div class="summary-card green">
                <div class="summary-title">Completed</div>
                <div class="summary-value" id="count-completed">0</div>
            </div>
            <div class="summary-card red">
                <div class="summary-title">Cancelled</div>
                <div class="summary-value" id="count-cancelled">0</div>
            </div>
            <div class="summary-card">
                <div class="summary-title">Total Orders</div>
                <div class="summary-value" id="count-total">0</div>
            </div>
        </section>

        <nav class="tabs">
            <button class="tab active" data-tab="Pending">Pending <span class="tab-count" id="tab-count-pending">0</span></button>
            <button class="tab" data-tab="Completed">Completed <span class="tab-count" id="tab-count-completed">0</span></button>
            <button class="tab" data-tab="Cancelled">Cancelled <span class="tab-count" id="tab-count-cancelled">0</span></button>
        </nav>

        <section class="order-grid" id="order-grid"></section>
    </main>

    <div id="toast" class="hidden"></div>

    <script>
        (function() {
            let state = { orders: [], currentTab: 'Pending' };

            const formatCurrency = (val) => '₹' + (parseFloat(val) || 0).toLocaleString('en-IN');

            const showToast = (msg) => {
                const t = document.getElementById('toast');
                t.textContent = msg;
                t.classList.remove('hidden');
                setTimeout(() => t.classList.add('hidden'), 3000);
            };

            const loadOrders = async () => {
                const btn = document.getElementById('btn-refresh');
                const statusEl = document.getElementById('conn-status');
                btn.disabled = true;

                try {
                    const res = await fetch('/.netlify/functions/getOrders');
                    if (!res.ok) throw new Error('Failed to fetch');
                    const data = await res.json();
                    state.orders = data.orders || [];
                    statusEl.textContent = '🟢 Connected';
                } catch (err) {
                    console.error(err);
                    statusEl.textContent = '🔴 Offline';
                    showToast('Could not fetch from Airtable.');
                } finally {
                    btn.disabled = false;
                    render();
                }
            };

            const updateStatus = async (id, newStatus) => {
                try {
                    const res = await fetch('/.netlify/functions/updateOrderStatus', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id, status: newStatus })
                    });
                    if (!res.ok) throw new Error('Update failed');
                    
                    showToast(`Order marked as ${newStatus}`);
                    await loadOrders();
                } catch (err) {
                    console.error(err);
                    showToast('Failed to update status in Airtable');
                }
            };

            const render = () => {
                const sortedOrders = [...state.orders].sort((a, b) => {
                    const timeA = new Date(a.createdAt || a.displayTime || 0).getTime();
                    const timeB = new Date(b.createdAt || b.displayTime || 0).getTime();
                    return timeB - timeA;
                });

                const pendingList = sortedOrders.filter(o => o.orderStatus === 'Pending');
                const completedList = sortedOrders.filter(o => o.orderStatus === 'Completed');
                const cancelledList = sortedOrders.filter(o => o.orderStatus === 'Cancelled');

                document.getElementById('count-pending').textContent = pendingList.length;
                document.getElementById('count-completed').textContent = completedList.length;
                document.getElementById('count-cancelled').textContent = cancelledList.length;
                document.getElementById('count-total').textContent = sortedOrders.length;
                
                document.getElementById('tab-count-pending').textContent = pendingList.length;
                document.getElementById('tab-count-completed').textContent = completedList.length;
                document.getElementById('tab-count-cancelled').textContent = cancelledList.length;

                let currentList = pendingList;
                if (state.currentTab === 'Completed') currentList = completedList;
                if (state.currentTab === 'Cancelled') currentList = cancelledList;

                const grid = document.getElementById('order-grid');

                if (currentList.length === 0) {
                    grid.innerHTML = `<div class="empty-state"><h3>No ${state.currentTab.toLowerCase()} orders found</h3></div>`;
                    return;
                }

                grid.innerHTML = currentList.map(order => {
                    const itemsHTML = order.items.map(i => `
                        <div class="item-row">
                            <span>${i.name} ${i.variant ? `(${i.variant})` : ''}</span>
                            <strong>x${i.qty}</strong>
                        </div>
                    `).join('');

                    let btnAction = '';
                    if (order.orderStatus === 'Pending') {
                        btnAction = `
                            <button class="btn btn-primary" onclick="window.handleStatus('${order.id}', 'Completed')">Complete</button>
                            <button class="btn btn-danger" onclick="window.handleStatus('${order.id}', 'Cancelled')">Cancel</button>
                        `;
                    } else if (order.orderStatus === 'Completed') {
                        btnAction = `
                            <button class="btn btn-outline" onclick="window.handleStatus('${order.id}', 'Pending')">Move to Pending</button>
                        `;
                    } else {
                        btnAction = `
                            <button class="btn btn-outline" onclick="window.handleStatus('${order.id}', 'Pending')">Restore</button>
                        `;
                    }

                    const cleanPhone = (order.customerMobile || '').replace(/\D/g, '');
                    const waBtn = cleanPhone.length >= 10 ? `
                        <a href="https://wa.me/91${cleanPhone.slice(-10)}?text=${encodeURIComponent('Namaste ' + order.customerName + ', regarding your order ' + order.orderNumber + ': ')}" target="_blank" class="btn btn-whatsapp" title="WhatsApp">
                            
                             <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" className="shrink-0">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z" />
              </svg>
                            
                            </a>
                    ` : '';

                    return `
                        <div class="order-card">
                            <div class="card-header">
                                <span class="order-num">${order.orderNumber}</span>
                                <span class="badge">${order.orderType}</span>
                            </div>
                            <div class="card-body">
                                <div>
                                    <div class="cust-name">${order.customerName}</div>
                                    <div class="cust-meta">📱 ${order.customerMobile || 'N/A'} | ⏰ ${order.displayTime || 'Recent'}</div>
                                    ${order.orderType === 'Delivery' ? `<div class="cust-meta" style="margin-top:2px;">📍 ${order.address}</div>` : ''}
                                </div>
                                <div class="items-box">${itemsHTML}</div>
                                ${order.notes ? `<div class="notes-box"><strong>Note:</strong> ${order.notes}</div>` : ''}
                                <div class="card-total">
                                    <span>Total Amount</span>
                                    <span>${formatCurrency(order.total)}</span>
                                </div>
                            </div>
                            <div class="card-footer">
                                ${btnAction}
                                ${waBtn}
                            </div>
                        </div>
                    `;
                }).join('');
            };

            window.handleStatus = (id, status) => updateStatus(id, status);

            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    e.currentTarget.classList.add('active');
                    state.currentTab = e.currentTarget.dataset.tab;
                    render();
                });
            });

            document.getElementById('btn-refresh').addEventListener('click', loadOrders);

            loadOrders();
        })();
    </script>
</body>
</html>
