<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kshirsagar Sweets & Bakers — Admin Dashboard</title>
    <style>
        :root {
            --bg-cream: #FDFBF7;
            --primary-green: #1B4332;
            --primary-green-hover: #2D6A4F;
            --accent-gold: #D4AF37;
            --accent-gold-light: #F9F4E3;
            --text-dark: #1A202C;
            --text-muted: #4A5568;
            --card-bg: #FFFFFF;
            --border-color: #E2E8F0;
            --success: #2F855A;
            --danger: #C53030;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.08);
            --radius-md: 8px;
            --radius-lg: 12px;
            --font-main: system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-main); background-color: var(--bg-cream); color: var(--text-dark); line-height: 1.5; }
        button, input { font-family: inherit; }
        button { cursor: pointer; border: none; background: none; }
        .hidden { display: none !important; }

        .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 1rem; }

        header {
            background-color: var(--primary-green);
            color: white;
            padding: 1rem;
            border-bottom: 3px solid var(--accent-gold);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .brand h1 { color: var(--accent-gold); font-size: 1.35rem; }
        .brand p { font-size: 0.8rem; color: #E2E8F0; }

        .header-controls { display: flex; align-items: center; gap: 1rem; }
        .btn-refresh {
            background-color: var(--accent-gold);
            color: var(--primary-green);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.85rem;
        }

        /* Summary Cards */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: 1.25rem 0;
        }
        .summary-card {
            background: var(--card-bg);
            padding: 1rem;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--primary-green);
            box-shadow: var(--shadow-sm);
        }
        .summary-card.gold { border-left-color: var(--accent-gold); }
        .summary-card.green { border-left-color: var(--success); }
        .summary-title { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
        .summary-value { font-size: 1.8rem; font-weight: 800; margin-top: 0.2rem; }

        /* Tabs */
        .tabs { display: flex; gap: 0.5rem; border-bottom: 2px solid var(--border-color); margin-bottom: 1.25rem; }
        .tab {
            padding: 0.75rem 1.25rem;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-muted);
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }
        .tab.active { color: var(--primary-green); border-bottom-color: var(--primary-green); }
        .tab-count { background: var(--border-color); padding: 0.1rem 0.5rem; border-radius: 99px; font-size: 0.75rem; }
        .tab.active .tab-count { background: var(--primary-green); color: white; }

        /* Grid */
        .order-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1rem; }
        .order-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .card-header {
            background: #F8FAFC;
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .order-num { font-weight: 800; color: var(--primary-green); }
        .badge { font-size: 0.7rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 4px; background: #EBF8FF; color: #2B6CB0; text-transform: uppercase; }
        
        .card-body { padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; flex: 1; }
        .cust-name { font-weight: 700; font-size: 1rem; }
        .cust-meta { font-size: 0.82rem; color: var(--text-muted); }
        
        /* Items Box (Google Sheet Style) */
        .items-box {
            background: var(--bg-cream);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 0.65rem;
            font-size: 0.85rem;
        }
        .item-row { display: flex; justify-content: space-between; padding: 0.2rem 0; border-bottom: 1px dashed #E2E8F0; }
        .item-row:last-child { border-bottom: none; }

        .notes-box { font-size: 0.78rem; background: #FFFBEB; color: #92400E; padding: 0.4rem 0.6rem; border-radius: 6px; border-left: 3px solid var(--accent-gold); }

        .card-total { display: flex; justify-content: space-between; font-weight: 800; font-size: 1.05rem; color: var(--primary-green); border-top: 1px solid var(--border-color); padding-top: 0.6rem; margin-top: auto; }

        .card-footer { padding: 0.75rem 1rem; background: #FCFDFD; border-top: 1px solid var(--border-color); display: flex; gap: 0.5rem; }
        .btn { padding: 0.5rem 0.75rem; border-radius: var(--radius-md); font-weight: 600; font-size: 0.82rem; flex: 1; text-align: center; }
        .btn-primary { background: var(--primary-green); color: white; }
        .btn-outline { border: 1px solid var(--primary-green); color: var(--primary-green); background: white; }
        .btn-whatsapp { background: #ECFDF5; color: #128C7E; border: 1px solid #A7F3D0; flex: 0 0 auto; }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 3rem; background: white; border-radius: var(--radius-lg); border: 1px dashed var(--border-color); color: var(--text-muted); }

        /* Toast */
        #toast { position: fixed; bottom: 1rem; right: 1rem; background: #1A202C; color: white; padding: 0.75rem 1.25rem; border-radius: var(--radius-md); font-size: 0.85rem; border-left: 4px solid var(--accent-gold); z-index: 100; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>Kshirsagar Sweets & Bakers</h1>
            <p>Admin Order Management Dashboard</p>
        </div>
        <div class="header-controls">
            <span id="conn-status" style="font-size: 0.8rem; background: rgba(255,255,255,0.15); padding: 0.3rem 0.6rem; border-radius: 99px;">Loading...</span>
            <button class="btn-refresh" id="btn-refresh">↻ Refresh Orders</button>
        </div>
    </header>

    <main class="container">
        <section class="summary-grid">
            <div class="summary-card gold">
                <div class="summary-title">Pending (Draft)</div>
                <div class="summary-value" id="count-pending">0</div>
            </div>
            <div class="summary-card green">
                <div class="summary-title">Completed</div>
                <div class="summary-value" id="count-completed">0</div>
            </div>
            <div class="summary-card">
                <div class="summary-title">Total Orders Loaded</div>
                <div class="summary-value" id="count-total">0</div>
            </div>
        </section>

        <nav class="tabs">
            <button class="tab active" data-tab="Pending">Pending Orders <span class="tab-count" id="tab-count-pending">0</span></button>
            <button class="tab" data-tab="Completed">Completed Orders <span class="tab-count" id="tab-count-completed">0</span></button>
        </nav>

        <section class="order-grid" id="order-grid"></section>
    </main>

    <div id="toast" class="hidden"></div>

    <script>
        (function() {
            let state = { orders: [], currentTab: 'Pending' };

            const formatCurrency = (val) => '₹' + (parseFloat(val) || 0).toLocaleString('en-IN');

            const showToast = (msg) => {
                const t = document.getElementById('toast');
                t.textContent = msg;
                t.classList.remove('hidden');
                setTimeout(() => t.classList.add('hidden'), 3000);
            };

            const loadOrders = async () => {
                const btn = document.getElementById('btn-refresh');
                const statusEl = document.getElementById('conn-status');
                btn.disabled = true;

                try {
                    const res = await fetch('/.netlify/functions/getOrders');
                    if (!res.ok) throw new Error('Failed to fetch');
                    const data = await res.json();
                    state.orders = data.orders || [];
                    statusEl.textContent = '🟢 Connected to Airtable';
                } catch (err) {
                    console.error(err);
                    statusEl.textContent = '🔴 Offline / Netlify Error';
                    showToast('Could not fetch from Airtable. Check Netlify Functions.');
                } finally {
                    btn.disabled = false;
                    render();
                }
            };

            const updateStatus = async (id, newStatus) => {
                try {
                    const res = await fetch('/.netlify/functions/updateOrderStatus', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id, status: newStatus })
                    });
                    if (!res.ok) throw new Error('Update failed');
                    
                    showToast(`Order marked as ${newStatus}`);
                    await loadOrders();
                } catch (err) {
                    console.error(err);
                    showToast('Failed to update status in Airtable');
                }
            };

            const render = () => {
                const pendingList = state.orders.filter(o => o.orderStatus === 'Pending');
                const completedList = state.orders.filter(o => o.orderStatus === 'Completed');

                document.getElementById('count-pending').textContent = pendingList.length;
                document.getElementById('count-completed').textContent = completedList.length;
                document.getElementById('count-total').textContent = state.orders.length;
                document.getElementById('tab-count-pending').textContent = pendingList.length;
                document.getElementById('tab-count-completed').textContent = completedList.length;

                const currentList = state.currentTab === 'Pending' ? pendingList : completedList;
                const grid = document.getElementById('order-grid');

                if (currentList.length === 0) {
                    grid.innerHTML = `<div class="empty-state"><h3>No ${state.currentTab} orders found</h3></div>`;
                    return;
                }

                grid.innerHTML = currentList.map(order => {
                    const itemsHTML = order.items.map(i => `
                        <div class="item-row">
                            <span>${i.name} ${i.variant ? `(${i.variant})` : ''}</span>
                            <strong>x${i.qty}</strong>
                        </div>
                    `).join('');

                    const btnAction = order.orderStatus === 'Pending'
                        ? `<button class="btn btn-primary" onclick="window.handleStatus('${order.id}', 'Completed')">Mark Completed</button>`
                        : `<button class="btn btn-outline" onclick="window.handleStatus('${order.id}', 'Pending')">Move to Pending</button>`;

                    const cleanPhone = (order.customerMobile || '').replace(/\D/g, '');
                    const waBtn = cleanPhone.length >= 10 ? `
                        <a href="https://wa.me/91${cleanPhone.slice(-10)}?text=${encodeURIComponent('Namaste ' + order.customerName + ', regarding your order ' + order.orderNumber + ': ')}" target="_blank" class="btn btn-whatsapp" title="WhatsApp">💬</a>
                    ` : '';

                    return `
                        <div class="order-card">
                            <div class="card-header">
                                <span class="order-num">${order.orderNumber}</span>
                                <span class="badge">${order.orderType}</span>
                            </div>
                            <div class="card-body">
                                <div>
                                    <div class="cust-name">${order.customerName}</div>
                                    <div class="cust-meta">📱 ${order.customerMobile || 'N/A'} | ⏰ ${order.displayTime || 'Recent'}</div>
                                    ${order.orderType === 'Delivery' ? `<div class="cust-meta" style="margin-top:2px;">📍 ${order.address}</div>` : ''}
                                </div>
                                <div class="items-box">${itemsHTML}</div>
                                ${order.notes ? `<div class="notes-box"><strong>Note:</strong> ${order.notes}</div>` : ''}
                                <div class="card-total">
                                    <span>Total Amount</span>
                                    <span>${formatCurrency(order.total)}</span>
                                </div>
                            </div>
                            <div class="card-footer">
                                ${btnAction}
                                ${waBtn}
                            </div>
                        </div>
                    `;
                }).join('');
            };

            window.handleStatus = (id, status) => updateStatus(id, status);

            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    e.currentTarget.classList.add('active');
                    state.currentTab = e.currentTarget.dataset.tab;
                    render();
                });
            });

            document.getElementById('btn-refresh').addEventListener('click', loadOrders);

            loadOrders();
        })();
    </script>
</body>
</html>
